name: Build m2-custom & Update Fleet Base Image

on:
  push:
    branches: [m2-custom]
  schedule:
    # Weekly upstream sync — Sunday 03:00 UTC
    - cron: '0 3 * * 0'

jobs:
  sync-upstream:
    name: Sync upstream/main → m2-custom
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "m2"
          git config user.email "m2@machinemachine.ai"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/openclaw/openclaw.git || true

      - name: Fetch & merge upstream/main
        run: |
          git fetch upstream main
          git merge upstream/main --no-edit || {
            echo "Merge conflict — manual resolution needed"
            exit 1
          }

      - name: Push merged m2-custom
        run: git push origin m2-custom

  build:
    name: Build openclaw m2-custom
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build
        run: |
          ls -lh dist/entry.js
          echo "Build ref: $(git rev-parse --short HEAD)"

      - name: Trigger m2-desktop rebuild
        run: |
          # Push a tag to m2-desktop repo to trigger its CI
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "http://git.machinemachine.ai/api/v1/repos/machine.machine/m2-desktop/dispatches" \
            -d "{\"event_type\": \"openclaw-updated\", \"client_payload\": {\"ref\": \"$(git rev-parse --short HEAD)\"}}" || true

          # Also notify m2 via fleet webhook
          curl -s -X POST \
            -H "X-Webhook-Secret: fleet2026" \
            "http://m2-desktop.internal:8890/notify" \
            -d "{\"event\": \"openclaw-built\", \"ref\": \"$(git rev-parse --short HEAD)\"}" || true
