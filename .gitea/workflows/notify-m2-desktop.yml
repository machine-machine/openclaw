name: Notify m2-desktop on m2-custom update

on:
  push:
    branches: [m2-custom]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger m2-desktop rebuild
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "http://git.machinemachine.ai/api/v1/repos/machine.machine/m2-desktop/actions/workflows/build-base-image.yml/dispatches" \
            -d '{"ref": "guacamole"}'
